<!DOCTYPE html>
<html lang="en"> 
<head>

 <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEBULA |  HSL-CORP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        :root {
            --c1: #00f0ff;
            --c2: #ff0040;
            --c3: #7c3aed;
            --bg: #050508;
            --glass: rgba(255,255,255,0.03);
            --border: rgba(255,255,255,0.06);
        }

        body {
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated particle grid */
        .grid-bg {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,240,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,240,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            animation: gridPulse 8s ease-in-out infinite;
        }

        @keyframes gridPulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* Floating particles */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .particles span {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--c1);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--c1), 0 0 20px var(--c1);
            animation: float linear infinite;
            opacity: 0.5;
        }

        .particles span:nth-child(1) { left: 10%; top: 20%; width: 6px; height: 6px; animation-duration: 14s; animation-delay: 0s; background: var(--c2); box-shadow: 0 0 8px var(--c2); }
        .particles span:nth-child(2) { left: 80%; top: 60%; width: 3px; height: 3px; animation-duration: 18s; animation-delay: 1s; background: var(--c3); box-shadow: 0 0 6px var(--c3); }
        .particles span:nth-child(3) { left: 25%; top: 80%; width: 5px; height: 5px; animation-duration: 12s; animation-delay: 2s; background: var(--c1); }
        .particles span:nth-child(4) { left: 70%; top: 10%; width: 3px; height: 3px; animation-duration: 20s; animation-delay: 0.5s; background: var(--c2); }
        .particles span:nth-child(5) { left: 50%; top: 50%; width: 4px; height: 4px; animation-duration: 16s; animation-delay: 1.5s; background: var(--c3); }
        .particles span:nth-child(6) { left: 90%; top: 85%; width: 5px; height: 5px; animation-duration: 13s; animation-delay: 0.8s; background: var(--c1); }
        .particles span:nth-child(7) { left: 5%; top: 40%; width: 3px; height: 3px; animation-duration: 17s; animation-delay: 2.2s; background: var(--c2); }
        .particles span:nth-child(8) { left: 45%; top: 15%; width: 6px; height: 6px; animation-duration: 15s; animation-delay: 1.2s; background: var(--c3); }

        @keyframes float {
            0% { transform: translateY(0) scale(1); opacity: 0.5; }
            25% { opacity: 1; }
            50% { transform: translateY(-40vh) scale(1.5); opacity: 0.8; }
            75% { opacity: 0.3; }
            100% { transform: translateY(-80vh) scale(0.5); opacity: 0; }
        }

        /* Ambient orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
        }

        .orb-1 { width: 400px; height: 400px; background: rgba(0,240,255,0.08); top: -150px; right: -100px; animation: orbMove 20s ease-in-out infinite; }
        .orb-2 { width: 350px; height: 350px; background: rgba(124,58,237,0.06); bottom: -100px; left: -100px; animation: orbMove 25s ease-in-out infinite reverse; }
        .orb-3 { width: 300px; height: 300px; background: rgba(255,0,64,0.05); top: 50%; left: 50%; transform: translate(-50%,-50%); animation: orbPulse 15s ease-in-out infinite; }

        @keyframes orbMove {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        @keyframes orbPulse {
            0%, 100% { opacity: 0.5; transform: translate(-50%,-50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%,-50%) scale(1.2); }
        }

        /* Login Container */
        .login-wrap {
            position: relative;
            z-index: 1;
            width: 380px;
        }

        /* Animated border card */
        .login-card {
            background: rgba(10,10,18,0.7);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: 28px;
            padding: 40px 32px;
            position: relative;
            overflow: hidden;
            animation: cardEnter 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .login-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 28px;
            padding: 1px;
            background: linear-gradient(135deg, var(--c1), var(--c2), var(--c3), var(--c1));
            background-size: 300% 300%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: borderFlow 6s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes borderFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes cardEnter {
            0% { opacity: 0; transform: perspective(800px) rotateX(10deg) translateY(40px) scale(0.95); }
            100% { opacity: 1; transform: perspective(800px) rotateX(0) translateY(0) scale(1); }
        }

        /* Inner glow */
        .login-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(0,240,255,0.03) 0%, transparent 50%);
            pointer-events: none;
            animation: glowShift 10s ease-in-out infinite;
        }

        @keyframes glowShift {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(5%, 5%); }
        }

        /* Brand */
        .brand {
            text-align: center;
            margin-bottom: 36px;
            position: relative;
            z-index: 1;
        }

        .brand .logo-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 16px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand .logo-icon svg {
            width: 56px;
            height: 56px;
            animation: logoSpin 20s linear infinite;
        }

        @keyframes logoSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .brand h1 {
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--c1), var(--c2), var(--c3));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: textShimmer 4s ease-in-out infinite;
            position: relative;
            display: inline-block;
        }

        .brand h1::after {
            content: 'HSL-CORP';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--c1), var(--c2), var(--c3));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: blur(10px);
            opacity: 0.5;
            animation: textShimmer 4s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes textShimmer {
            0%, 100% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(30deg); }
        }

        .brand .sub {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.3);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-top: 6px;
            font-weight: 600;
        }

        /* Input Groups */
        .input-group {
            margin-bottom: 18px;
            position: relative;
            z-index: 1;
        }

        .input-group label {
            display: block;
            font-size: 0.65rem;
            font-weight: 700;
            color: rgba(255,255,255,0.35);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            transition: 0.3s;
        }

        .input-field {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            padding: 14px 18px;
            border-radius: 14px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: 0.4s cubic-bezier(0.2, 0, 0, 1);
        }

        .input-field:focus {
            border-color: var(--c1);
            background: rgba(0,240,255,0.03);
            box-shadow: 0 0 30px rgba(0,240,255,0.05), inset 0 0 30px rgba(0,240,255,0.02);
        }

        .input-field:focus ~ label,
        .input-field:not(:placeholder-shown) ~ label {
            color: var(--c1);
        }

        .input-field::placeholder {
            color: rgba(255,255,255,0.15);
            font-weight: 400;
        }

        /* Focus glow line */
        .input-group .glow-line {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--c1), var(--c2));
            border-radius: 2px;
            transition: 0.5s cubic-bezier(0.2, 0, 0, 1);
            transform: translateX(-50%);
        }

        .input-field:focus ~ .glow-line {
            width: 80%;
        }

        /* Button */
        .btn-wrap {
            position: relative;
            z-index: 1;
            margin-top: 24px;
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-weight: 800;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, var(--c1), var(--c3), var(--c2));
            background-size: 200% 200%;
            color: #fff;
            animation: btnGradient 4s ease-in-out infinite;
            transition: 0.4s cubic-bezier(0.2, 0, 0, 1);
        }

        @keyframes btnGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .btn-login::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: translateX(-100%);
            transition: 0.6s;
        }

        .btn-login:hover::before { transform: translateX(100%); }

        .btn-login:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 15px 40px rgba(0,240,255,0.2), 0 0 60px rgba(124,58,237,0.1);
        }

        .btn-login:active { transform: scale(0.97); }

        /* Loader */
        .loader {
            display: none;
            justify-content: center;
            margin-top: 20px;
            position: relative;
            z-index: 1;
        }

        .loader-ring {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.05);
            border-top-color: var(--c1);
            border-right-color: var(--c2);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Error Message */
        #login-msg {
            margin-top: 16px;
            font-size: 0.8rem;
            padding: 12px 16px;
            border-radius: 12px;
            display: none;
            position: relative;
            z-index: 1;
            background: rgba(255,0,64,0.08);
            border: 1px solid rgba(255,0,64,0.15);
            color: var(--c2);
            text-align: center;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        /* Footer */
        .footer {
            margin-top: 24px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .footer a {
            color: rgba(255,255,255,0.3);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: 0.3s;
            position: relative;
        }

        .footer a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 1px;
            background: linear-gradient(90deg, var(--c1), var(--c2));
            transition: 0.4s;
        }

        .footer a:hover { color: rgba(255,255,255,0.7); }
        .footer a:hover::after { width: 100%; }

        @media (max-width: 480px) {
            .login-wrap { width: 90%; }
            .login-card { padding: 32px 24px; }
        }
.welcome-text {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;

    font-size: 35px;
    font-weight: 900;
    letter-spacing: 2px;
    white-space: nowrap;
    text-align: center;

    background: linear-gradient(
        90deg,
        #00f0ff,
        #7c3aed,
        #ff0080,
        #ff3d00,
        #00f0ff
    );
    background-size: 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rgbText 4s linear infinite;
}

@keyframes rgbText {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
}
    </style>
</head>

<body>

   <div class="auth-card">

    <h1 class="welcome-text">WELCOME TO JATIN REGEDIT</h1>

</body>
    <div class="grid-bg"></div>
    <div class="particles">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
    </div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="login-wrap">
        <div class="login-card">
            <div class="brand">
                <div class="logo-icon">
                    <svg viewBox="0 0 100 100" fill="none">
                        <defs>
                            <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#00f0ff"/>
                                <stop offset="50%" stop-color="#7c3aed"/>
                                <stop offset="100%" stop-color="#ff0040"/>
                            </linearGradient>
                        </defs>
                        <path d="M50 10 L80 30 L80 70 L50 90 L20 70 L20 30 Z" stroke="url(#lg)" stroke-width="2" fill="none"/>
                        <circle cx="50" cy="50" r="15" stroke="url(#lg)" stroke-width="2" fill="none"/>
                        <circle cx="50" cy="50" r="4" fill="url(#lg)"/>
                        <path d="M30 35 L50 20 L70 35" stroke="url(#lg)" stroke-width="1.5" fill="none"/>
                        <path d="M30 65 L50 80 L70 65" stroke="url(#lg)" stroke-width="1.5" fill="none"/>
                    </svg>
                </div>
                <h1>HSL-CORP</h1>
                <div class="sub">Internal Framework V5</div>
            </div>

            <form id="login-form">
                <div class="input-group">
                    <label>IDENTIFY</label>
                    <input type="text" name="Username" class="input-field" placeholder="Username" required>
                    <div class="glow-line"></div>
                </div>
                <div class="input-group">
                    <label>SECURITY KEY</label>
                    <input type="password" name="Password" class="input-field" placeholder="••••••••" required>
                    <div class="glow-line"></div>
                </div>

                <div class="btn-wrap">
                    <button type="submit" class="btn-login" id="login-btn">Initialize Access</button>
                </div>

                <div class="loader" id="login-loader">
                    <div class="loader-ring"></div>
                </div>
            </form>

            <div id="login-msg"></div>

            <div class="footer">
                <a href="/register">Request Account</a>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const loginBtn = document.getElementById('login-btn');
        const loader = document.getElementById('login-loader');
        const messageBox = document.getElementById('login-msg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            messageBox.style.display = "none";
            loginBtn.style.display = "none";
            loader.style.display = "flex";

            const formData = new FormData(form);
            const data = new URLSearchParams();
            for (const pair of formData) { data.append(pair[0], pair[1]); }

            try {
                const response = await fetch('/', { method: 'POST', body: data });
                if (response.redirected) {
                    localStorage.setItem('playLoginSuccessSound', '1');
                    window.location.href = response.url;
                } else {
                    const text = await response.text();
                    loader.style.display = "none";
                    loginBtn.style.display = "block";
                    messageBox.innerHTML = text;
                    messageBox.style.display = "block";
                }
            } catch (err) {
                loader.style.display = "none";
                loginBtn.style.display = "block";
                messageBox.innerText = "Connection Error";
                messageBox.style.display = "block";
            }
        });
    </script>
</body>
